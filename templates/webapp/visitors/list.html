{% extends "base.html" %}{% block title %}Посетители{% endblock %}{% block content %}<h1>Посетители</h1><div class="grid">{% for visitor in visitors %}<article class="item"><h2>{{ visitor.full_name|default:"Без имени" }}</h2><p>Документ: {{ visitor.document }}</p><a href="{% url 'webapp:visitor_detail' visitor.visitor_id %}">Открыть карточку</a></article>{% empty %}<p>Посетители ещё не добавлены.</p>{% endfor %}</div>{% endblock %}
